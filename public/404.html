<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found</title>
    <script>
      // GitHub Pages serves this file for any unmatched path. We only use
      // that to support the pretty dynamic route /cronos/protocol/<slug>/,
      // which has no real file behind it. Redirect that one shape to the
      // real page with the slug as a query param; everything else gets a
      // plain "not found" message with a way back home.
      (function () {
        var m = window.location.pathname.match(/^\/cronos\/protocol\/([^/]+)\/?$/);
        if (m && m[1] && m[1] !== "index.html") {
          var slug = m[1];
          window.location.replace(
            "/cronos/protocol/index.html?slug=" + encodeURIComponent(slug) + "&redirect=1" + window.location.search.replace(/^\?/, "&")
          );
        }
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
        color: #e6edf3;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .box { text-align: center; }
      a { color: #64ffda; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Page not found</h1>
      <p><a href="/cronos/">Back to the Cronos DeFi Dashboard</a></p>
    </div>
  </body>
</html>
